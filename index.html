<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>사택 공용공간 당번 관리</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-orbs">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <div class="wrap">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark">🏠</span>
        <div>
          <h1>사택 공용공간 당번</h1>
          <p class="subtitle">화장실 청소 &amp; 분리수거 로테이션</p>
        </div>
      </div>
      <div class="roster" id="roster"></div>
    </header>

    <main>
      <section class="hero-card" id="heroCard">
        <div class="hero-left">
          <span class="hero-eyebrow" id="heroWeekLabel">이번 주 당번</span>
          <div class="hero-person">
            <span class="avatar avatar-lg" id="heroAvatar"></span>
            <div>
              <h2 id="heroName">-</h2>
              <p class="hero-range" id="heroRange"></p>
            </div>
          </div>
        </div>
        <div class="hero-right">
          <div class="task-list" id="heroTasks"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h3>당번 캘린더</h3>
          <div class="cal-nav">
            <button id="prevMonth" aria-label="이전 달">‹</button>
            <span id="monthLabel"></span>
            <button id="nextMonth" aria-label="다음 달">›</button>
            <button id="todayBtn" class="today-btn">오늘</button>
          </div>
        </div>

        <div class="legend" id="legend"></div>

        <div class="calendar" id="calendar"></div>
      </section>

      <section class="panel" id="selectedPanel">
        <div class="panel-head">
          <h3>선택한 주 체크리스트</h3>
          <span class="selected-range" id="selectedRange"></span>
        </div>
        <div class="selected-body">
          <div class="selected-person" id="selectedPerson"></div>
          <div class="task-list" id="selectedTasks"></div>
        </div>
      </section>

      <section class="panel upcoming-panel">
        <div class="panel-head">
          <h3>다음 순번 미리보기</h3>
        </div>
        <div class="upcoming-list" id="upcomingList"></div>
      </section>
    </main>

    <footer>
      <p>순번: 윤다니엘 → 박창수 → 김경민 → (반복) · 기준일 2026-09-14(월) = 박창수</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
